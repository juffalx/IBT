<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h1>Addis Market Shopping List</h1>

    <form id="item-form">
      <input
        type="text"
        id="item-input"
        placeholder="Add an item..."
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>

    <p id="count">0 items</p>

    <ul id="list"></ul>

    <script src="js/script.js"></script>
  </body>
</html>
