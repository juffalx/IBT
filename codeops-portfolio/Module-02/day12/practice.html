<!-- Build: "Habesha Eatery" reservation page
  Starting from the provided skeleton, build a single accessible HTML page (CSS already
  supplied) that brings today's topics together.
  Your page must include:
  • A reservation form: name, email, tel, date, party-size (number), and a special-requests
  textarea — every field labelled and validated
  • A menu table with caption, column scope headers, and a price column in ETB
  • A media block: a dish image with real alt text and a map iframe with a title
  • Semantic landmarks (header / nav / main / footer) and a single h1
  • A <head> with a unique title and a meta description -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reserve a table at Habesha Eatery and explore our traditional Ethiopian menu."
    />
    <title>Habesha Eatery reservation page</title>
  </head>

  <body>
    <header>
      <h1>Habesha Eatery</h1>
      <nav>
        <a href="./project.html">Reservation Form</a>
        <a href="#menu">Menu</a>
      </nav>
    </header>

    <main>
      <section>
        <picture>
          <img
            src="asset/image/Habesha_image.png"
            alt="A plate of Doro Wat served with Injera"
          />
        </picture>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m24!1m12!1m3!1d18744.34969589081!2d38.77736193880002!3d9.016776305855126!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m9!3e6!4m3!3m2!1d9.038509699999999!2d38.7190091!4m3!3m2!1d9.0200599!2d38.8035147!5e0!3m2!1sen!2set!4v1785679419487!5m2!1sen!2set"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          title="Habesha Eatery Location"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>

        <form id="reservation" action="#" method="post">
          <fieldset>
            <legend>Reservation Form</legend>
            <label for="name">Name: </label>
            <input id="name" name="name" required />
            <br /><br />
            <label for="email">Email: </label>
            <input id="email" name="email" type="email" required />
            <br /><br />
            <label for="tel">Phone: </label>
            <input
              id="tel"
              name="tel"
              type="tel"
              required
              pattern="0(7|9){1}[0-9]{8}"
            />
            <br /><br />
            <label for="date">Date: </label>
            <input id="date" name="date" type="date" required />
            <br /><br />
            <label for="party-size">Party Size: </label>
            <input
              id="party-size"
              name="party-size"
              type="number"
              min="1"
              max="20"
              required
            />
            <br /><br />
            <label for="special-requests">Special Requests: </label>
            <textarea id="special-requests" name="special-requests"></textarea>
            <br /><br />
            <button type="submit">Submit</button>
          </fieldset>
        </form>
      </section>

      <table border="1" id="menu">
        <caption>
          Menu
        </caption>
        <thead>
          <tr>
            <th scope="col">Dish</th>
            <th scope="col">Description</th>
            <th scope="col">Price (ETB)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Injera with Doro Wat</td>
            <td>Traditional Ethiopian flatbread with spicy chicken stew</td>
            <td>150</td>
          </tr>
          <tr>
            <td>Tibs</td>
            <td>Sautéed meat with vegetables and spices</td>
            <td>120</td>
          </tr>
          <tr>
            <td>Shiro</td>
            <td>Chickpea stew served with injera</td>
            <td>100</td>
          </tr>
        </tbody>
      </table>
    </main>
    <footer>
      <p>&copy; 2026 Habesha Eatery</p>
    </footer>
  </body>
</html>
