<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birr Watch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Birr Watch</h1>
        <p class="subtitle">Live Ethiopian Birr (ETB) Converter & Watchlist</p>
      </header>

      <div id="status-line" class="status loading">
        Initializing application...
      </div>

      <main class="main-content">
        <section class="card conversion-section">
          <h2>Currency Converter</h2>
          <form id="convert-form" novalidate>
            <div class="form-group">
              <label for="target-currency">Currency:</label>
              <select id="target-currency" required disabled>
                <option value="">Loading currencies...</option>
              </select>
            </div>

            <div class="form-group">
              <label for="amount">Amount (in selected currency):</label>
              <input
                type="number"
                id="amount"
                placeholder="e.g., 100"
                min="0.01"
                step="any"
                value="100"
                required
              />
            </div>

            <button type="submit" id="convert-btn" disabled>
              Convert to ETB
            </button>
          </form>

          <div id="conversion-result" class="result-display hidden"></div>
        </section>

        <section class="card watchlist-section">
          <div class="watchlist-header">
            <h2>My Watchlist</h2>
          </div>
          <p class="watchlist-hint">
            Currencies you convert to are added here automatically.
          </p>

          <ul id="watchlist-items" class="watchlist-list"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
