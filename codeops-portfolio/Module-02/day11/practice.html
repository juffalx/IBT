Work through these in a folder called day11/. Open each file in your browser and inspect it with dev
tools.
1. Boilerplate. Create hello.html with the full HTML5 boilerplate and an <h1>. Open it in the

2. Elements. Add a paragraph with a <strong> and an <em> word, plus an image with a
