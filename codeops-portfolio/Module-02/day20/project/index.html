<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Atlas — Country Facts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="masthead__eyebrow">No. 20 — Field Reference</div>
        <h1 class="masthead__title">The Field Atlas</h1>
        <p class="masthead__sub">
          A pocket dossier on any country, pulled live from the wire.
        </p>
      </header>

      <form id="search-form" class="search" autocomplete="off">
        <label for="country-input" class="search__label"
          >Look up a country</label
        >
        <div class="search__row">
          <input
            id="country-input"
            type="text"
            name="country"
            placeholder="e.g. Ethiopia, Japan, Peru…"
            value="Ethiopia"
          />
          <button type="submit">Search</button>
        </div>
      </form>

      <main id="facts" class="dossier">
        <!-- Loading / error / result states are rendered here  -->
      </main>

      <footer class="colophon">
        Data via
        <a href="https://restcountries.com" target="_blank" rel="noopener"
          >restcountries.com</a
        >
      </footer>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
